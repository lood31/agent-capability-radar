[project]
name = "agent-capability-radar"
version = "0.1.0"
description = "Rule-based GitHub capability discovery for students and agent users"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

